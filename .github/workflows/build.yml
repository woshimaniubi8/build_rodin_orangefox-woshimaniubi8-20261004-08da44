name: Build OrangeFox for rodin

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rodin-orangefox-${{ github.ref }}
  cancel-in-progress: false

env:
  ORANGEFOX_BRANCH: '14.1'
  ORANGEFOX_SYNC_REVISION: '11e4406b2bd1de939a26b6bfbad7e371cc3b1fa7'
  DEVICE_TREE_REPOSITORY: 'woshimaniubi8/orangefox_twrp_device_xiaomi_rodin'
  DEVICE_TREE_BRANCH: 'main'
  ORANGEFOX_TOP: ${{ github.workspace }}/OrangeFox
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: '3G'
  CCACHE_CACHE_VERSION: '1'
  MAX_OTA_BYTES: '12000000000'
  OF_BUILD_JOBS: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out public build request
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out rodin device tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEVICE_TREE_REPOSITORY }}
          ref: ${{ env.DEVICE_TREE_BRANCH }}
          fetch-depth: 1
          path: device-tree

      - name: Verify device-tree baseline blobs
        id: device_tree
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git -C device-tree rev-parse HEAD)"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "Using latest device-tree main commit: ${revision}"
          python3 - <<'PY'
          from pathlib import Path

          root = Path("device-tree/prebuilt")
          readme = root / "README.md"
          if not readme.is_file() or readme.read_bytes().startswith(b"version https://git-lfs.github.com/spec/v1"):
              raise SystemExit("prebuilt/README.md is missing or still a Git LFS pointer; update DEVICE_TREE_BRANCH or enable Git LFS checkout")

          modules = (
              "focaltech_touch_rodin.ko",
              "goodix_core_rodin.ko",
              "nxp_i2c.ko",
              "p73.ko",
              "scp.ko",
              "si_haptic.ko",
              "xiaomi_touch_rodin.ko",
          )
          for name in modules:
              path = root / "global/modules" / name
              if not path.is_file() or path.read_bytes()[:4] != bytes.fromhex("7f454c46"):
                  raise SystemExit(f"prebuilt/global/modules/{name} is missing or not a hydrated ELF module; update DEVICE_TREE_BRANCH or enable Git LFS checkout")
          print("Device-tree README and Global modules are regular Git blobs.")
          PY

      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      # slimhub only clears caches. Hosted runner pools differ in disk size:
      # some jobs report ~138 GiB free, others only ~63 GiB on a ~73 GiB disk.
      # Reclaim the unused SDK/toolchain payload as well so both pools get as
      # much headroom as the image can give.
      - name: Reclaim hosted-image toolchains
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/reclaim-runner-space.sh

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick jq lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lz4 openjdk-17-jdk-headless pngcrush python-is-python3 \
            python3 ripgrep rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev golang-go \
            erofs-utils android-sdk-libsparse-utils e2fsprogs file liblzma-dev
          sudo apt-get clean
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=${java_home}" >> "$GITHUB_ENV"

      - name: Read build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test -s build-request.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          request = json.loads(Path("build-request.json").read_text())
          assert request.get("version") == 1, "unsupported build request version"
          source = request.get("source", {})
          assert source.get("type") in {"url", "release"}, "invalid source type"
          profile = request.get("profile", "auto")
          assert profile in {"auto", "cn", "global"}, "invalid profile"
          print(f"profile={profile}")
          print(f"source_type={source['type']}")
          print(f"release_tag={source.get('tag', '')}")
          PY

      - name: Check runner capacity before source sync
        shell: bash
        id: capacity
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          echo "available_kib=$available_kib" >> "$GITHUB_OUTPUT"
          df -h "$GITHUB_WORKSPACE"
          free -h
          echo '--- largest directories inside the workspace ---'
          du -sh "$GITHUB_WORKSPACE"/* 2>/dev/null | sort -hr | head -10 || true
          echo '--- largest host tool directories outside the workspace ---'
          du -sh /usr/share /usr/lib /opt /usr/local "$RUNNER_TEMP" /home/runner 2>/dev/null | sort -hr | head -10 || true
          # The pinned source checkout plus .repo metadata peaks around 40 GiB
          # and out/ adds roughly 40 GiB more, so sync needs real headroom.
          # Hosted pools differ in raw disk size (some give ~138 GiB free,
          # others only ~63 GiB), so require the smaller of 48 GiB and 70% of
          # the observed filesystem instead of a single fixed number.
          filesystem_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $2 }')"
          required_kib=$((48 * 1024 * 1024))
          proportional_kib=$((filesystem_kib * 70 / 100))
          if (( proportional_kib < required_kib )); then required_kib="$proportional_kib"; fi
          echo "required_kib=$required_kib" >> "$GITHUB_OUTPUT"
          if [[ -z "$available_kib" || "$available_kib" -lt "$required_kib" ]]; then
            echo "::error::OrangeFox sync needs at least $((required_kib / 1024 / 1024)) GiB free; found $((available_kib / 1024 / 1024)) GiB on a $((filesystem_kib / 1024 / 1024)) GiB filesystem. GitHub's hosted runner pools differ in disk size; rerun the job or use a larger GitHub-hosted runner."
            exit 1
          fi
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          if [[ -z "$memory_kib" || "$memory_kib" -lt $((14 * 1024 * 1024)) ]]; then
            echo "::error::This build requires a 16 GB-class GitHub-hosted runner."
            exit 1
          fi

      - name: Prepare runner swap
        shell: bash
        env:
          MIN_SWAP_GIB: '12'
          PREFERRED_SWAP_GIB: '16'
          MIN_FREE_KIB: ${{ steps.capacity.outputs.required_kib }}
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/rodin-swap"
          bash scripts/setup-swap.sh
          df -h "$GITHUB_WORKSPACE"
          # The swapfile lives on the workspace filesystem, so re-check the
          # headroom it consumed before starting a multi-GiB repo sync.
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib="${{ steps.capacity.outputs.required_kib }}"
          if [[ -z "$available_kib" || "$available_kib" -lt "$required_kib" ]]; then
            echo "::error::Only $((available_kib / 1024 / 1024)) GiB free after creating swap; OrangeFox sync needs $((required_kib / 1024 / 1024)) GiB. Run the reclaim step, or use a larger GitHub-hosted runner."
            exit 1
          fi

      - name: Restore compiler cache
        id: ccache_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orangefox-rodin-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ env.ORANGEFOX_SYNC_REVISION }}-${{ github.sha }}
          restore-keys: |
            orangefox-rodin-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ env.ORANGEFOX_SYNC_REVISION }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          install -d "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          install -d "$HOME/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -euo pipefail
          manifest_repo="$GITHUB_WORKSPACE/pinned-manifest"
          export GIT_CONFIG_GLOBAL="$GITHUB_WORKSPACE/ci-gitconfig"
          mkdir -p "$manifest_repo"
          cp device-tree/manifests/orangefox-fox_14.1-pinned.xml "$manifest_repo/default.xml"
          git -C "$manifest_repo" init --initial-branch=main --quiet
          git -C "$manifest_repo" config user.name 'OrangeFox CI'
          git -C "$manifest_repo" config user.email 'orangefox-ci@localhost'
          git -C "$manifest_repo" add default.xml
          git -C "$manifest_repo" commit --quiet -m 'Pinned OrangeFox 14.1 manifest'
          git config --global protocol.file.allow always
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 600
          mkdir -p "$ORANGEFOX_TOP"
          cd "$ORANGEFOX_TOP"
          repo init --depth=1 -u "file://${manifest_repo}" -b main -m default.xml
          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ sync heartbeat'
              df -h "$GITHUB_WORKSPACE"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          sync_succeeded=0
          for attempt in 1 2 3; do
            if repo sync -c -j4 --retry-fetches=3 --no-clone-bundle --no-tags --optimized-fetch; then
              sync_succeeded=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep "$((attempt * 20))"; fi
          done
          [[ "$sync_succeeded" -eq 1 ]] || { echo '::error::OrangeFox source sync failed after three attempts.'; exit 1; }
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Apply OrangeFox setup patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/ofox-sync"
          git -C "$GITHUB_WORKSPACE/ofox-sync" checkout --detach "$ORANGEFOX_SYNC_REVISION"
          patch="$GITHUB_WORKSPACE/ofox-sync/patches/patch-vold-fox_14.1.diff"
          test "$(sha256sum "$patch" | awk '{print $1}')" = 29b4b0b387c3185a3dcc69f141a3c84969510547d13ed2de71eefa8423c57778
          if ! git -C "$ORANGEFOX_TOP/system/vold" apply --reverse --check "$patch" 2>/dev/null; then
            git -C "$ORANGEFOX_TOP/system/vold" apply --check "$patch"
            git -C "$ORANGEFOX_TOP/system/vold" apply "$patch"
          fi

      - name: Prepare firmware profile
        id: profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_PROFILE: ${{ steps.request.outputs.profile }}
          SOURCE_TYPE: ${{ steps.request.outputs.source_type }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          DEVICE_TREE_COMMIT: ${{ steps.device_tree.outputs.revision }}
        run: |
          set -euo pipefail
          script='scripts/create-profile-baseline.py'
          test -s "$script"
          grep -Fq 'def source_modules_dep' "$script"
          grep -Fq 'if len(indexes) > 1:' "$script"
          if grep -Fq 'not indexes and module in RECOVERY_MODULES' "$script"; then
            echo '::error::stale profile builder still rejects a missing modules.dep entry (for example si_haptic.ko).' >&2
            exit 1
          fi
          echo "Profile builder revision: $(sha256sum "$script" | awk '{print $1}')"
          echo 'Profile builder accepts missing leaf modules.dep entries and rejects duplicate entries.'
          mkdir -p "$ORANGEFOX_TOP/device/xiaomi/rodin"
          bash scripts/prepare-profile.sh \
            "$GITHUB_WORKSPACE/build-request.json" \
            "$GITHUB_WORKSPACE/device-tree" \
            "$GITHUB_WORKSPACE/profile-inputs" \
            "$GITHUB_OUTPUT"
          python3 - "$GITHUB_WORKSPACE/profile-inputs/profile.json" "$DEVICE_TREE_REPOSITORY" "$DEVICE_TREE_COMMIT" <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          data = json.loads(report.read_text())
          data["device_tree"] = {"repository": sys.argv[2], "revision": sys.argv[3]}
          report.write_text(json.dumps(data, indent=2) + "\n")
          PY
          # The profile builder mutates device-tree/ in place with the
          # request's kernel, DTB, platform ramdisk, module blobs, manifest,
          # and generated guards. Copy that mutated tree into OrangeFox; do
          # not recopy the original baseline after profile generation.
          rsync -a --delete --exclude .git --exclude images \
            device-tree/ "$ORANGEFOX_TOP/device/xiaomi/rodin/"
          if [[ "${{ steps.profile.outputs.firmware_variant }}" == global ]]; then
          python3 - "$ORANGEFOX_TOP/device/xiaomi/rodin" "$GITHUB_WORKSPACE/profile-inputs/vendor_ramdisk00" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          tree = pathlib.Path(sys.argv[1])
          ramdisk = pathlib.Path(sys.argv[2])
          digest = hashlib.sha256(ramdisk.read_bytes()).hexdigest()
          relative = 'prebuilt/global/vendor_ramdisk00'
          manifest = tree / 'manifests/device-blobs.sha256'
          lines = manifest.read_text().splitlines()
          target = 'device/xiaomi/rodin/' + relative
          matches = [i for i, line in enumerate(lines) if line.split(maxsplit=1)[-1:] == [target]]
          if len(matches) != 1:
              raise SystemExit(f'expected one manifest entry for {target}, found {len(matches)}')
          lines[matches[0]] = digest + '  ' + target
          manifest.write_text('\n'.join(lines) + '\n')
          verify = tree / 'tools/verify-build-inputs.sh'
          text = verify.read_text()
          marker = '"${DEVICE_DIR}/prebuilt/global/vendor_ramdisk00"'
          text, size_count = re.subn(
              r'(?m)^(check_size "\$\{DEVICE_DIR\}/prebuilt/global/vendor_ramdisk00" )\d+$',
              r'\g<1>' + str(ramdisk.stat().st_size), text,
          )
          text, sha_count = re.subn(
              r'(?m)^(check_sha256 "\$\{DEVICE_DIR\}/prebuilt/global/vendor_ramdisk00" )[0-9a-f]{64}$',
              r'\g<1>' + digest, text,
          )
          if size_count != 1 or sha_count != 1:
              raise SystemExit(f'expected one Global size/hash guard, found size={size_count} sha={sha_count}')
          verify.write_text(text)
          print(f'Forced Global platform guard to {ramdisk.stat().st_size} bytes / {digest}')
          PY
          fi
          echo 'Profiled Global platform guard:'
          grep -F 'prebuilt/global/vendor_ramdisk00' "$ORANGEFOX_TOP/device/xiaomi/rodin/tools/verify-build-inputs.sh"
          grep -F 'prebuilt/global/vendor_ramdisk00' "$ORANGEFOX_TOP/device/xiaomi/rodin/manifests/device-blobs.sha256"
          if grep -E '^check_sha256 .*manifests/device-blobs\.sha256 ' "$ORANGEFOX_TOP/device/xiaomi/rodin/tools/verify-build-inputs.sh"; then
            echo '::error::Dynamic profile verifier still pins the generated blob manifest hash.'
            exit 1
          fi

      - name: Apply device source patches and verify inputs
        env:
          RODIN_FIRMWARE_VARIANT: ${{ steps.profile.outputs.firmware_variant }}
        shell: bash
        run: |
          set -euo pipefail
          "$ORANGEFOX_TOP/device/xiaomi/rodin/tools/apply-orangefox-patches.sh" "$ORANGEFOX_TOP"
          "$ORANGEFOX_TOP/device/xiaomi/rodin/tools/verify-build-inputs.sh" "$ORANGEFOX_TOP"

      - name: Remove sync metadata and check compile capacity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP/.repo" "$GITHUB_WORKSPACE/ofox-sync" \
            "$GITHUB_WORKSPACE/pinned-manifest" "$GITHUB_WORKSPACE/ci-gitconfig"
          rm -rf "$GITHUB_WORKSPACE/device-tree/.git"
          rm -rf "$RUNNER_TEMP/rodin-payload-bin" "$RUNNER_TEMP/payload-tools"
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          # out/ for this device peaks around 40 GiB; 22 GiB is the floor that
          # still leaves room for the 3 GiB compiler cache and image output.
          if [[ -z "$available_kib" || "$available_kib" -lt $((22 * 1024 * 1024)) ]]; then
            echo "::error::OrangeFox build needs at least 22 GiB free after .repo cleanup; found $((available_kib / 1024 / 1024)) GiB."
            exit 1
          fi
          du -sh "$ORANGEFOX_TOP"
          df -h "$GITHUB_WORKSPACE"

      - name: Compile OrangeFox vendor_boot
        shell: bash
        working-directory: ${{ env.ORANGEFOX_TOP }}
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
          FOX_BUILD_DEVICE: rodin
          FOX_AB_DEVICE: '1'
          FOX_VIRTUAL_AB_DEVICE: '1'
          OF_FORCE_PREBUILT_KERNEL: '1'
          OF_LOW_MEMORY_BUILD: '1'
          GOMEMLIMIT: '3GiB'
          GOGC: '20'
          _JAVA_OPTIONS: '-Xmx3g'
          USE_CCACHE: '1'
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: 'true'
          RODIN_FIRMWARE_VARIANT: ${{ steps.profile.outputs.firmware_variant }}
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          export OF_BUILD_JOBS="$jobs"
          export NINJA_ARGS="-j${jobs} -l${jobs}"
          export SOONG_UI_NINJA_ARGS="$NINJA_ARGS"
          (
            while sleep 60; do date -u '+%Y-%m-%dT%H:%M:%SZ build heartbeat'; df -h "$GITHUB_WORKSPACE"; free -h; done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          device/xiaomi/rodin/build-lowmem.sh vendorbootimage 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Validate images and profile report
        shell: bash
        env:
          RODIN_FIRMWARE_VARIANT: ${{ steps.profile.outputs.firmware_variant }}
        run: |
          set -euo pipefail
          product="$ORANGEFOX_TOP/out/target/product/rodin"
          case "$RODIN_FIRMWARE_VARIANT" in
            cn)
              standard='OrangeFox-R12.0-Unofficial-rodin-system-compatible.img'
              noavb='OrangeFox-R12.0-Unofficial-rodin-disable-avb-system-compatible.img' ;;
            global)
              standard='OrangeFox-R12.0-Unofficial-rodin-global-system-compatible.img'
              noavb='OrangeFox-R12.0-Unofficial-rodin-global-disable-avb-system-compatible.img' ;;
            *) echo "unsupported profile variant: $RODIN_FIRMWARE_VARIANT" >&2; exit 1 ;;
          esac
          for image in "$standard" "$noavb"; do
            test -s "$product/$image"
            test "$(stat -c %s "$product/$image")" = 67108864
            sha256sum "$product/$image" > "profile-inputs/$image.sha256"
          done
          "$ORANGEFOX_TOP/out/host/linux-x86/bin/avbtool" verify_image --image "$product/$standard"
          mkdir -p artifacts
          cp -fp "$product/$standard" "$product/$noavb" profile-inputs/profile.json artifacts/
          cp -fp profile-inputs/*.sha256 artifacts/
          cp -fp "$GITHUB_WORKSPACE/orangefox-build.log" artifacts/ || true

      - name: Save compiler cache
        if: ${{ success() && steps.ccache_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orangefox-rodin-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ env.ORANGEFOX_SYNC_REVISION }}-${{ github.sha }}

      - name: Upload images and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-rodin-${{ steps.profile.outputs.firmware_variant || 'profile-check' }}-${{ github.run_id }}
          path: |
            artifacts/**
            profile-inputs/profile.json
            orangefox-build.log
            OrangeFox/out/logs/**
          if-no-files-found: warn
          retention-days: 30

      - name: Report compiler cache
        if: always()
        run: ccache -s || true
